name: PyPI publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use an existing stable tag such as v0.1.0.' >&2
            exit 1
          fi

      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"

      - name: Verify package identity and version
        run: |
          uv run --no-project python - <<'PY'
          import ast, os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'ssh-ls', 'Unexpected package name'
          assert os.environ['RELEASE_TAG'] == 'v' + project['version'], 'Tag must match package version'
          module = ast.parse(pathlib.Path('ssh_ls/__init__.py').read_text())
          version = next(ast.literal_eval(node.value) for node in module.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == '__version__'
                                 for target in node.targets))
          assert version == project['version'], 'CLI and package versions must match'
          print('Preparing ssh-ls', version)
          PY

      - name: Run tests
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -s tests -v

      - name: Build and check wheel and sdist
        run: |
          uv build
          uvx --from twine twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/ssh-ls" --version
          : > "$RUNNER_TEMP/empty-ssh-config"
          "$RUNNER_TEMP/wheel-smoke/bin/ssh-ls" --doctor --no-history --config "$RUNNER_TEMP/empty-ssh-config"

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssh-ls
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
