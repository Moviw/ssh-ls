name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Smoke-test installer in an isolated tool directory
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/ssh-ls-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/ssh-ls-bin"
          sh install.sh
          "$UV_TOOL_BIN_DIR/ssh-ls" --demo --doctor

      - name: Install OpenSSH server for native localhost integration test
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd

      - name: Run isolated native SSH integration test
        if: matrix.os == 'ubuntu-latest'
        env:
          SSH_LS_INTEGRATION: "1"
        run: uv run python -m unittest discover -s tests -p test_native_ssh.py -v

      - name: Build package
        run: uv build

  release:
    name: Publish GitHub test release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - name: Verify tag and build release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          PY
          uv build --sdist
          cp dist/ssh_ls-*.tar.gz dist/ssh-ls.tar.gz
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/ssh-ls.tar.gz --verify-tag --latest --generate-notes
